name: C/C++ CI

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  
  build:

    runs-on: ubuntu-latest

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Setup latest GCC
      uses: egor-tensin/setup-gcc@v1
      with:
        version: latest
        platform: x64

    - name: Check GCC version and set C standard flag
      id: check_gcc
      run: |
        GCC_VERSION=$(gcc -dumpversion | cut -d. -f1)
        echo "GCC major version: $GCC_VERSION"
        if [ "$GCC_VERSION" -ge 14 ]; then
          echo "STD_FLAG=-std=c23" >> $GITHUB_OUTPUT
        else
          echo "STD_FLAG=-std=c2x" >> $GITHUB_OUTPUT
        fi

    - name: Install SDL2
      uses: libsdl-org/setup-sdl@main
      id: sdl
      with:
        install-linux-dependencies: true
        version: 2-latest
        version-sdl-image: 2-latest

    - name: make
      run: make
    
    - name: Upload artifact
      uses: actions/upload-artifact@v4 
      with:
          name: myChip8emulator
          path: chip8